<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="70%" stop-color="#070a12" />
      <stop offset="100%" stop-color="#020408" />
    </radialGradient>

    <!-- Neon Cyan Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Emerald Auction Pulse Gradient -->
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="40%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Gold Bail Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="neonGlowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="neonGlowPulse" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="neonGlowGold" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Squircle / Shield Container -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="4" />
  <rect x="28" y="28" width="456" height="456" rx="100" fill="none" stroke="#00e5ff" stroke-width="2" stroke-opacity="0.25" />

  <!-- Background Radar / Arena Pulse Rings -->
  <circle cx="256" cy="270" r="160" fill="none" stroke="#00e5ff" stroke-width="1.5" stroke-opacity="0.08" stroke-dasharray="6 8" />
  <circle cx="256" cy="270" r="110" fill="none" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.12" />

  <!-- Dynamic Auction Orbit Arc (Sweeping Energy Wave) -->
  <path d="M 120 330 C 140 180, 360 160, 400 290" fill="none" stroke="url(#cyanGrad)" stroke-width="4" stroke-linecap="round" stroke-opacity="0.4" filter="url(#neonGlowCyan)" />
  <path d="M 112 334 C 114 320, 126 312, 138 318" fill="none" stroke="#00e5ff" stroke-width="5" stroke-linecap="round" filter="url(#neonGlowCyan)" />

  <!-- Cricket Wickets & Pulse Wave -->
  <!-- Left Stump -->
  <rect x="180" y="200" width="18" height="175" rx="9" fill="url(#cyanGrad)" filter="url(#neonGlowCyan)" />

  <!-- Right Stump -->
  <rect x="314" y="200" width="18" height="175" rx="9" fill="url(#cyanGrad)" filter="url(#neonGlowCyan)" />

  <!-- Center Stump (Dynamic Auction Pulse Waveform) -->
  <g filter="url(#neonGlowPulse)">
    <!-- Main Center Core -->
    <rect x="246" y="165" width="20" height="210" rx="10" fill="url(#pulseGrad)" />
    
    <!-- Bid Frequency Pulse Bars (Ascending Waveform on Center Stump) -->
    <rect x="230" y="215" width="52" height="6" rx="3" fill="#34d399" opacity="0.9" />
    <rect x="222" y="240" width="68" height="6" rx="3" fill="#38bdf8" opacity="0.95" />
    <rect x="216" y="265" width="80" height="7" rx="3.5" fill="#00e5ff" />
    <rect x="224" y="290" width="64" height="6" rx="3" fill="#34d399" opacity="0.9" />
    <rect x="232" y="315" width="48" height="6" rx="3" fill="#10b981" opacity="0.85" />
  </g>

  <!-- Floating Glowing Bails -->
  <g filter="url(#neonGlowGold)">
    <!-- Left Bail -->
    <rect x="172" y="176" width="76" height="12" rx="6" fill="url(#goldGrad)" transform="rotate(-6 210 182)" />
    <!-- Right Bail -->
    <rect x="264" y="176" width="76" height="12" rx="6" fill="url(#goldGrad)" transform="rotate(6 302 182)" />
  </g>

  <!-- Pitch Ground Line / Base Platform -->
  <rect x="140" y="385" width="232" height="6" rx="3" fill="url(#cyanGrad)" opacity="0.7" filter="url(#neonGlowCyan)" />

  <!-- Bid Pulse Blip (Gavel Strike Spark) -->
  <circle cx="256" cy="165" r="7" fill="#ffffff" filter="url(#neonGlowGold)" />
  <circle cx="256" cy="165" r="14" fill="none" stroke="#fef08a" stroke-width="2" opacity="0.8" />
</svg>
